# Unsigned iOS build (.ipa) on a cloud Mac. Sideload-sign it on Windows with Sideloadly + a free Apple ID.
name: iOS IPA
on:
  push:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build app (no code signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -target App -configuration Release -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          APP=build/Release-iphoneos/App.app
          test -n "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr Vateko.fun.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Vateko.fun-ipa
          path: Vateko.fun.ipa
